[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fitbit-air-lab"
version = "0.1.0"
description = "Descarga, analiza y visualiza los datos de tu Google Fitbit Air con la Google Health API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fitbit-air = "fitbit_air.cli:main"

[tool.setuptools]
packages = ["fitbit_air"]
